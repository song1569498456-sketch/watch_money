name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e '.[dev,browser]'
      - run: ruff check backend tests scripts --select E4,E7,E9,F
      - run: pytest -q
        env:
          WATCH_MONEY_COLLECT: '0'
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_smoke.py
      - run: python scripts/browser_followup.py
      - run: python scripts/browser_fee.py
      - run: python scripts/browser_navigation.py
      - run: python scripts/browser_funding_matrix.py
      - run: python scripts/browser_overview_freshness.py
      - run: python scripts/browser_market_view_order.py
      - run: python scripts/browser_asset_verification.py
      - run: python scripts/browser_identity_catalog.py
      - run: python scripts/browser_five_second_refresh.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: |
            docs/evidence/
            docs/screenshots/

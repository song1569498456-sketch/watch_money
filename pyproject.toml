[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "watch-money"
version = "0.1.0"
description = "Public crypto market monitoring and transparent opportunity calculations"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "ccxt>=4.4,<5", "duckdb>=1.2,<2", "pyarrow>=19,<24"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]
browser = ["playwright>=1.50,<2"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
watch_money = ["adapters/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"
